syntax = "proto3";

package agentguard.snapshot.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// A read-only, point-in-time capture of facts collected from a live
// Environment. Snapshot files are written in Protobuf canonical JSON.
//
// A Snapshot never holds a secret value. Credentials are recorded by their
// existence, location, permissions, and fingerprint only.
message Snapshot {
  // Version of this schema the Snapshot was written with.
  string schema_version = 1;
  // Unique ID of this Snapshot.
  string snapshot_id = 2;
  // Version of the Collector that produced this Snapshot.
  string collector_version = 3;
  // When the Snapshot was collected.
  google.protobuf.Timestamp collected_at = 4;
  // The principal the Collector ran as, for example a Linux user name or an
  // AWS ARN.
  string collected_by = 5;
  // The provider-native identity of the Environment the Snapshot describes.
  EnvironmentIdentity environment = 6;
  // Facts the Collector tried to gather but could not.
  repeated BlindSpot blind_spots = 7;

  // The Environment-specific facts.
  oneof payload {
    LinuxPayload linux = 10;
    AwsPayload aws = 11;
  }
}

// The provider-native identity of an Environment.
message EnvironmentIdentity {
  oneof identity {
    LinuxEnvironmentIdentity linux = 1;
    AwsEnvironmentIdentity aws = 2;
  }
}

// Identity of a Linux host.
message LinuxEnvironmentIdentity {
  // Contents of /etc/machine-id.
  string machine_id = 1;
  // Fingerprint of the SSH host key, for example "SHA256:...".
  string ssh_host_key_fingerprint = 2;
}

// Identity of an AWS account.
message AwsEnvironmentIdentity {
  // The 12-digit AWS account ID.
  string account_id = 1;
}

// A fact the Collector tried to gather but could not.
message BlindSpot {
  // What the Collector tried to gather, for example a path or an API call.
  string attempted = 1;
  // Why it failed, for example "permission denied".
  string reason = 2;
}

// Facts collected from a Linux host.
message LinuxPayload {
  // The Linux user the agent runs as.
  LinuxUser agent_user = 1;
  // Credential files found on the host.
  repeated CredentialFile credential_files = 2;
  // The Docker daemon's socket, when the host has one. Whoever can write to
  // it can run containers as root on the host.
  DockerSocket docker_socket = 3;
}

// A Linux user and its group memberships.
message LinuxUser {
  string name = 1;
  uint32 uid = 2;
  repeated LinuxGroup groups = 3;
}

// A Linux group.
message LinuxGroup {
  string name = 1;
  uint32 gid = 2;
}

// The Docker daemon's socket, recorded by its location, owner, and
// permissions only. The Collector never connects to it.
message DockerSocket {
  // Absolute path of the socket, for example "/var/run/docker.sock".
  string path = 1;
  // UID of the socket's owner.
  uint32 owner_uid = 2;
  // GID of the socket's group.
  uint32 group_gid = 3;
  // Permission bits in octal, for example "0660".
  string mode = 4;
}

// The kind of a credential file.
enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  // An AWS shared credentials file, such as ~/.aws/credentials.
  CREDENTIAL_KIND_AWS_SHARED_CREDENTIALS = 1;
}

// A file holding credentials, recorded without its contents.
message CredentialFile {
  // Absolute path of the file.
  string path = 1;
  CredentialKind kind = 2;
  // UID of the file's owner.
  uint32 owner_uid = 3;
  // GID of the file's group.
  uint32 group_gid = 4;
  // Permission bits in octal, for example "0600".
  string mode = 5;
  // Fingerprint of the file's contents, for example "sha256:...".
  string fingerprint = 6;
  // Profiles in an AWS shared credentials file.
  repeated AwsCredentialProfile aws_profiles = 7;
}

// One profile in an AWS shared credentials file.
message AwsCredentialProfile {
  // Profile name, for example "default".
  string name = 1;
  // Fingerprint of the profile's access key ID, for example "sha256:...".
  // It links the profile to the AWS Identity the key resolves to.
  string access_key_id_fingerprint = 2;
}

// Facts collected from an AWS account.
message AwsPayload {
  // Identities the Collector resolved, with their identity-based policies.
  repeated AwsIdentity identities = 1;
}

// An AWS Identity, such as an IAM role or user.
message AwsIdentity {
  // The Identity's ARN.
  string arn = 1;
  // Fingerprints of access key IDs that resolve to this Identity. They match
  // AwsCredentialProfile.access_key_id_fingerprint in a Linux Snapshot.
  repeated string access_key_id_fingerprints = 2;
  // Identity-based policies attached to this Identity directly, managed or
  // inline.
  repeated AwsPolicy policies = 3;
  // IAM groups the Identity is a member of. Their policies apply to the
  // Identity too. Only an IAM user can be in a group.
  repeated AwsGroup groups = 4;
}

// An IAM group, with the identity-based policies attached to it.
message AwsGroup {
  // The group's ARN.
  string arn = 1;
  // Group name.
  string name = 2;
  // Identity-based policies attached to the group, managed or inline.
  repeated AwsPolicy policies = 3;
}

// How an identity-based policy is attached.
enum PolicyKind {
  POLICY_KIND_UNSPECIFIED = 0;
  // A managed policy, AWS managed or customer managed, attached by ARN.
  POLICY_KIND_MANAGED = 1;
  // An inline policy, embedded in one Identity or group.
  POLICY_KIND_INLINE = 2;
}

// An identity-based IAM policy.
message AwsPolicy {
  // Policy name.
  string name = 1;
  // The policy document, exactly as AWS returns it.
  google.protobuf.Struct document = 2;
  // Whether the policy is managed or inline.
  PolicyKind kind = 3;
  // ARN of a managed policy. Empty for an inline policy.
  string arn = 4;
}
